<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060A"/>
      <stop offset=".6" stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".7" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#FACC15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#F9FAFB"/>
      <stop offset="1" stop-color="#9CA3AF"/>
    </radialGradient>
    <path id="bat" d="M0,-8 L-6,-15 L-8,-6 C-20,-8 -34,-4 -50,6 C-40,6 -34,10 -32,18 C-26,12 -18,12 -14,18 C-10,10 -4,10 0,17 C4,10 10,10 14,18 C18,12 26,12 32,18 C34,10 40,6 50,6 C34,-4 20,-8 8,-6 L6,-15 Z"/>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#E5E7EB">
    <circle cx="80" cy="40" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="90" r="1"/>
    <circle cx="340" cy="30" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="70" r="1"/>
    <circle cx="640" cy="22" r="1.2"><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="50" r="1"/>
    <circle cx="1120" cy="100" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="1060" cy="70" r="38" fill="url(#moon)" opacity=".9"/>
  <circle cx="1048" cy="62" r="6" fill="#9CA3AF" opacity=".4"/>
  <circle cx="1072" cy="84" r="4" fill="#9CA3AF" opacity=".35"/>

  <!-- signal beam + signal -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 300 300;6 300 300;-6 300 300" dur="8s" repeatCount="indefinite"/>
    <polygon points="292,300 308,300 470,40 330,40" fill="url(#beam)"/>
    <ellipse cx="400" cy="70" rx="78" ry="44" fill="url(#glow)">
      <animate attributeName="opacity" values=".85;1;.85" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <use href="#bat" transform="translate(400 66) scale(1.25)" fill="#0B0B0F"/>
  </g>

  <!-- flying bats -->
  <g fill="#000">
    <use href="#bat" transform="scale(.28)">
      <animateMotion path="M-100,160 C200,60 500,200 1300,90" dur="11s" repeatCount="indefinite"/>
    </use>
    <use href="#bat" transform="scale(.2)">
      <animateMotion path="M1300,60 C900,150 600,40 -100,120" dur="14s" repeatCount="indefinite"/>
    </use>
    <use href="#bat" transform="scale(.16)">
      <animateMotion path="M-100,60 C300,140 700,20 1300,150" dur="17s" begin="3s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- skyline back -->
  <g fill="#1F2430">
    <rect x="0" y="210" width="70" height="130"/>
    <rect x="90" y="180" width="50" height="160"/>
    <rect x="460" y="170" width="60" height="170"/>
    <rect x="700" y="190" width="70" height="150"/>
    <rect x="880" y="160" width="55" height="180"/>
    <rect x="1080" y="200" width="80" height="140"/>
  </g>
  <!-- skyline front -->
  <g fill="#0B0D12">
    <rect x="30" y="250" width="90" height="90"/>
    <rect x="140" y="220" width="70" height="120"/>
    <polygon points="230,340 230,210 260,180 290,210 290,340"/>
    <rect x="280" y="300" width="40" height="40"/>
    <rect x="270" y="296" width="60" height="8"/>
    <rect x="330" y="235" width="80" height="105"/>
    <rect x="420" y="200" width="55" height="140"/>
    <rect x="490" y="245" width="100" height="95"/>
    <polygon points="600,340 600,150 625,120 650,150 650,340"/>
    <rect x="622" y="90" width="6" height="32"/>
    <rect x="660" y="230" width="90" height="110"/>
    <rect x="760" y="205" width="60" height="135"/>
    <rect x="830" y="255" width="110" height="85"/>
    <rect x="950" y="215" width="70" height="125"/>
    <rect x="1030" y="240" width="90" height="100"/>
    <rect x="1130" y="225" width="70" height="115"/>
  </g>
  <!-- windows -->
  <g fill="#FACC15">
    <rect x="160" y="240" width="6" height="8"><animate attributeName="opacity" values="1;.1;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="180" y="270" width="6" height="8"/>
    <rect x="350" y="260" width="6" height="8"/>
    <rect x="380" y="290" width="6" height="8"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="440" y="230" width="6" height="8"/>
    <rect x="615" y="180" width="6" height="8"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="690" y="260" width="6" height="8"/>
    <rect x="785" y="240" width="6" height="8"><animate attributeName="opacity" values=".1;1;.1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="980" y="250" width="6" height="8"/>
    <rect x="1060" y="270" width="6" height="8"><animate attributeName="opacity" values="1;.3;1" dur="4.5s" repeatCount="indefinite"/></rect>
    <rect x="1160" y="255" width="6" height="8"/>
  </g>

  <text x="1160" y="320" text-anchor="end" fill="#6B7280" font-family="monospace" font-size="12" letter-spacing="4">GOTHAM · AFTER DARK · BUILD MODE ON</text>
</svg>
