<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <defs>
    <radialGradient id="g">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset=".75" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#CA8A04"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset=".6" stop-color="#FACC15" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FACC15" stop-opacity="0"/>
    </radialGradient>
    <path id="bat" d="M0,-8 L-6,-15 L-8,-6 C-20,-8 -34,-4 -50,6 C-40,6 -34,10 -32,18 C-26,12 -18,12 -14,18 C-10,10 -4,10 0,17 C4,10 10,10 14,18 C18,12 26,12 32,18 C34,10 40,6 50,6 C34,-4 20,-8 8,-6 L6,-15 Z"/>
  </defs>
  <circle cx="130" cy="130" r="125" fill="url(#halo)">
    <animate attributeName="r" values="110;128;110" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="130" r="92" fill="url(#g)" stroke="#111" stroke-width="6"/>
  <g transform="translate(130 128)">
    <use href="#bat" transform="scale(1.55)" fill="#0B0B0F">
      <animateTransform attributeName="transform" type="scale" values="1.5;1.62;1.5" dur="2.4s" repeatCount="indefinite"/>
    </use>
  </g>
  <circle cx="130" cy="130" r="92" fill="none" stroke="#FEF08A" stroke-width="2" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" values="0 130 130;360 130 130" dur="20s" repeatCount="indefinite"/>
  </circle>
</svg>
